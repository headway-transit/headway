[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headway-api"
version = "0.1.0"
description = "Headway API: computed transit metrics with lineage, DQ workflow, and the audited certification action. Never originates a figure."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary,pool]>=3.1",  # pool extra (psycopg-pool, same upstream,
                          # same LGPL-3.0-with-exception allowlist tier —
                          # pre-approved on scripts/license_allowlist.toml):
                          # per-request pooled connections so sibling requests
                          # never serialize behind one connection lock
                          # (handoff 0023, design point 1)
    "PyJWT>=2.8",         # MIT
    "bcrypt>=4.1",        # Apache-2.0 — password hashing choice (ADR-0001: OSI permissive)
    "httpx>=0.27",        # BSD-3-Clause — signed webhook delivery (handoff 0006);
                          # moved from the test extra (it also backs fastapi.testclient)
    "python-multipart>=0.0.9",  # Apache-2.0 — multipart parsing for the
                                # branding logo upload (handoff 0008 pillar C)
    "openpyxl>=3.1",      # MIT — server-side XLSX export alongside CSV
                          # (handoff 0017 design point 5); values written as
                          # TEXT cells so figures stay byte-equal to the CSV
                          # (floating point never touches a figure)
    "cryptography>=42",   # Apache-2.0 OR BSD-3-Clause (pyca; ADR-0001 tier 2
                          # permissive) — Ed25519 certification signatures
                          # (handoff 0019; headway_api/signing.py). The
                          # signing KEY lives only in the environment/secret
                          # file, never in this repo or the database.
    "headway-calc>=0.5",  # Apache-2.0 — SIBLING PATH PACKAGE (services/calc,
                          # not on PyPI): GET /reports/mr20 imports
                          # headway_calc.mr20 and serves its package verbatim
                          # (handoff 0009). Install from the repo first
                          # (`pip install services/calc`); the api Docker
                          # image must do the same — Dockerfile follow-up,
                          # see README "MR-20 preview report".
    "headway-transform>=0.1",
                          # Apache-2.0 — SIBLING PATH PACKAGE (services/
                          # transform, not on PyPI). POST /admin/block-labels
                          # reuses headway_transform.block_labels so the
                          # upload screen and tools/block-labels/derive.py
                          # run THE SAME derivation. Re-implementing it here
                          # would give an agency two answers about what a
                          # block is called, and only one of them audited.
]

[project.optional-dependencies]
# Machine ingest (handoff 0006): object store + broker clients. Optional so a
# read-only deployment carries neither; without them the ingest endpoint
# refuses with a plain-language 503 (never a silent accept).
ingest = [
    "minio>=7.2",           # Apache-2.0 — MinIO/S3 object store client
    "kafka-python-ng>=2.2", # Apache-2.0 — Kafka producer (maintained fork)
    # The raw-record inspector (handoff 0035) READS the same two stores back:
    # object_ref payloads from MinIO, and the base64 payloads GTFS-Realtime
    # frames ride inline on the broker (contracts/topics.v0.md) — the only
    # place those bytes exist. Hence the two additions below, both on the
    # same optional extra: an installation without ingest configured refuses
    # the inspector's payload endpoints in plain words, exactly as the
    # ingest endpoint already refuses with a 503.
    "python-snappy>=0.7",   # BSD — the Go producer snappy-compresses batches
                            # by default and kafka-python-ng cannot decode
                            # them without this. >=0.7 is a pure-Python shim
                            # over cramjam (manylinux wheels), so no
                            # libsnappy-dev and no C toolchain in the image —
                            # the services/transform Dockerfile precedent.
    "gtfs-realtime-bindings>=1.0.0",  # Apache-2.0 — the SAME pinned bindings
                            # services/transform normalizes with, so what an
                            # auditor reads in a decoded preview is what the
                            # pipeline read. Decoding is display only; no
                            # figure originates here.
]
test = [
    "pytest>=8",
    "jsonschema>=4.21",   # MIT — ingest envelopes validated against the actual contract schema
]

[tool.setuptools.packages.find]
include = ["headway_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
