[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headway-mcp"
version = "0.1.0"
description = "Headway MCP server: exposes Headway's read surface to AI assistants over the Model Context Protocol. API client only — every figure carries its receipt, refusals pass through, nothing is ever computed here."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # Official Model Context Protocol Python SDK — MIT (license-gated per
    # ADR-0001; verified against the installed distribution metadata).
    "mcp>=1.0",
    # HTTP client for the Headway API — BSD-3-Clause (already in the tree
    # via services/api core deps; same license tier).
    "httpx>=0.27",
]

[project.optional-dependencies]
# pytest: MIT (OSI permissive).
test = ["pytest>=8"]

[project.scripts]
headway-mcp = "headway_mcp.server:main"

[tool.setuptools.packages.find]
include = ["headway_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
