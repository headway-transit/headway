<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headway map overlay preview (developer tool)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      /* The canvas wrap the inspector positions itself inside, mirroring
         .map-canvas-wrap on the real page. */
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #overlay > * {
        pointer-events: auto;
      }
      #caption {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 3;
        margin: 0;
        padding: 6px 10px;
        border-radius: 4px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        max-width: 46rem;
        background: rgba(255, 255, 255, 0.92);
        color: #1f2328;
      }
      #caption.on-dark {
        background: rgba(5, 7, 11, 0.92);
        color: #f2f5fa;
      }
    </style>
  </head>
  <body>
    <!--
      DEVELOPER TOOL — not part of the shipped app.

      `vite build` has exactly one HTML input (web/index.html), so this page
      never enters the production artifact; it is served only by `npm run dev`
      and `npm run preview`. Its whole job is to let a person LOOK at the
      handoff-0043 overlay — the mode-aware vehicle marks, a flagged finding
      and the relationship inspector — over this installation's real
      /basemap/region.pmtiles archive, without needing an API or a login.
      That is what produced the overlay screenshots in the handoff evidence.

      It imports the SHIPPED modules: `overlayLayerSpecs()` for every layer,
      `vehiclesToGeojson()` for the mode join, `placeFindings()` for the
      flags, `findingChain()` for the chain, and the real
      <RelationshipInspector /> component with the real stylesheet — so what
      you see is what /map draws, not a mock-up of it. Like the app, it makes
      zero external requests: archive, glyphs, fonts and code all come from
      this origin.

      Query string:  ?style=light|dark  &zoom=15  &lng=..&lat=..  &panel=0
    -->
    <div id="map"></div>
    <div id="overlay"></div>
    <p id="caption"></p>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
