# nginx config for the headway-web static image (web/Dockerfile).
# Written to run as the NON-ROOT `nginx` user: unprivileged port (8080),
# pid + temp paths under /tmp (the only writable location in the container).
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    # Non-root: every temp path must live somewhere writable.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: react-router owns the paths; unknown routes serve
        # index.html (never a 404 for a client-side route).
        location / {
            try_files $uri /index.html;
        }

        # index.html must revalidate (it names the hashed asset files) …
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        # … while the content-hashed Vite assets are immutable.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Self-hosted basemap (handoff 0027): region.pmtiles from the
        # compose bind mount (deploy/compose/basemap -> /basemap, read-only).
        # PMTiles is read with HTTP byte-range requests; nginx serves ranges
        # for static files by default (max_ranges is unlimited unless set).
        # This location does NOT inherit the SPA fallback above (try_files
        # is per-location): an absent basemap answers 404 — the map's honest
        # "no basemap" detection — never index.html wearing a 200. no-cache:
        # a refreshed basemap (re-running --download-basemap) is picked up
        # on reload instead of a year-stale cached copy. (No try_files here:
        # try_files + alias is a known nginx footgun; plain alias 404s
        # missing files by itself.)
        location /basemap/ {
            alias /basemap/;
            default_type application/octet-stream;
            add_header Cache-Control "no-cache";
        }
    }
}
